services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: nyxor-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: nyxor
      POSTGRES_USER: nyxor
      POSTGRES_PASSWORD: nyxor_local_dev
    volumes:
      - nyxor-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyxor -d nyxor"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nyxor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nyxor-postgres-data:
