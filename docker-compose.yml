services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: vex-os-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: vexos
      POSTGRES_USER: vexos
      POSTGRES_PASSWORD: vexos_local_dev
    volumes:
      - vex-os-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vexos -d vexos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vex-os-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vex-os-postgres-data:
