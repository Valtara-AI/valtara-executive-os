name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks/gitleaks-action@v2 requires a paid GITLEAKS_LICENSE for
      # organization repos (this one is under Valtara-AI). Running the OSS
      # CLI binary directly instead of the Action wrapper keeps this free.
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar xz gitleaks
      - name: Run gitleaks
        run: ./gitleaks detect --source . --verbose --redact

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # SRS §7 / SEC-001 §4: "Automated vulnerability scanning on every
      # build; critical/high CVEs block deployment." Blocking as of
      # DL-SEC-005 (drizzle-orm 0.38->0.45.2), which closed the last
      # unresolved production CVE - DL-SEC-003 (Next.js) closed the chain
      # this job was originally added non-blocking for.
      #
      # --omit=dev deliberately: "block deployment" means the deployed
      # artifact, and devDependencies (vitest, vite, esbuild, drizzle-kit)
      # never ship - they're build/test tooling, not the running
      # application. Those currently do carry known advisories (e.g.
      # vitest's UI-server arbitrary-file-read CVE, GHSA-5xrq-8626-4rwp),
      # but only vitest --ui listening (never used in this repo's scripts
      # or CI) is the actual attack surface - tracked separately, doesn't
      # gate deployment. `npm ci` above still installs dev deps for the
      # other jobs; this step alone scopes what it audits.
      - run: npm audit --omit=dev --audit-level=high

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    # Postgres AND Redis services, not just the CI cache/lint jobs above,
    # because several tests are gated on DATABASE_URL/REDIS_URL being set
    # and otherwise only ever *skip* (see packages/database's
    # external-action-trigger.test.ts and apps/api's engine.test.ts /
    # agent-task-worker.test.ts) - including the HITL-enforcement trigger
    # test and the real BullMQ worker test, two of the most important tests
    # in the Sprint 1/2 plan. Without these services, CI would report green
    # while those invariants were never actually checked.
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: nyxor
          POSTGRES_USER: nyxor
          POSTGRES_PASSWORD: nyxor_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nyxor -d nyxor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # DL-SEC-004: DATABASE_URL is the restricted nyxor_app role the test
      # suite actually runs against (provisioned by `npm run db:migrate`
      # below, via DATABASE_MIGRATION_URL - the bootstrap role Docker's
      # official postgres image always creates as a superuser). Using the
      # bootstrap role directly as DATABASE_URL - what this used to do -
      # is exactly the setup that let audit_log_entries' RLS-based
      # immutability guarantee go unenforced under CI's own connection;
      # see packages/database/src/__tests__/audit-log-immutability.test.ts.
      DATABASE_URL: postgresql://nyxor_app:nyxor_app_ci@localhost:5432/nyxor
      DATABASE_MIGRATION_URL: postgresql://nyxor:nyxor_ci@localhost:5432/nyxor
      DB_APP_ROLE_PASSWORD: nyxor_app_ci
      REDIS_URL: redis://localhost:6379
      # Not real secrets - a throwaway AES key for a throwaway CI database,
      # and dummy OAuth client values that only need to be non-empty
      # (every test mocks the actual Google/Microsoft/Slack HTTP calls).
      # Without these, every test gated on DB_ENCRYPTION_KEY/*_CLIENT_ID
      # silently *skips* rather than runs - which is what was happening
      # here through all of Sprint 4 (34 tests skipped, unnoticed, because
      # CI reports green either way). Discovered and fixed alongside
      # Sprint 5.
      DB_ENCRYPTION_KEY: "Cb1aYTc+N+JpEqVvfKFpN3G4gSDA5xsALOKoXr1l42Y="
      GOOGLE_CLIENT_ID: ci-test-google-client-id
      GOOGLE_CLIENT_SECRET: ci-test-google-client-secret
      GOOGLE_REDIRECT_URI: http://localhost:3001/api/v1/integrations/google/callback
      MICROSOFT_CLIENT_ID: ci-test-microsoft-client-id
      MICROSOFT_CLIENT_SECRET: ci-test-microsoft-client-secret
      MICROSOFT_REDIRECT_URI: http://localhost:3001/api/v1/integrations/microsoft/callback
      SLACK_CLIENT_ID: ci-test-slack-client-id
      SLACK_CLIENT_SECRET: ci-test-slack-client-secret
      SLACK_REDIRECT_URI: http://localhost:3001/api/v1/integrations/slack/callback
      PANDADOC_CLIENT_ID: ci-test-pandadoc-client-id
      PANDADOC_CLIENT_SECRET: ci-test-pandadoc-client-secret
      PANDADOC_REDIRECT_URI: http://localhost:3001/api/v1/integrations/pandadoc/callback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Workspace packages' package.json "main"/"types" point at dist/, not
      # src/ (needed so a plain `node dist/index.js` in the production
      # Docker image can resolve @nyxor/* without a TS runtime) - so
      # cross-package imports (e.g. apps/api importing @nyxor/database)
      # only resolve once dist/ actually exists. dist/ is gitignored, so
      # every fresh checkout - this one included - needs a build first.
      # `tsc --build` (not `npm run build`) deliberately skips apps/web's
      # `next build` here - the backend test suite doesn't need it, and it's
      # already covered by the separate Build job below.
      - run: npx tsc --build
      - run: npm run db:migrate
      - run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, dependency-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
